name: Test Making Sense generator

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/generate_making_sense.py"
      - "tests/test_generate_making_sense.py"
      - "templates/making-sense/**"
      - ".github/workflows/making-sense-generator-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run generator tests
        run: python3 -m unittest discover -s tests
